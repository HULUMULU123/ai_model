Гараж (главный образ):
- тёмно-синий комбинезон, спущен и завязан на талии
- белая майка в рубчик
- старые кеды
- пучок на крабе-заколке
Гараж, вечер:
- оверсайз-фланелька сине-красная поверх майки
- джинсы
- старые кеды
Город, кофе:
- выцветшая футболка с мотоспортивным принтом
- джинсовые шорты или прямые джинсы
- очки в стиле 80-х
Поездки и море:
- льняная рубашка кремового цвета, завязанная узлом
- скромный купальник
Холодный сезон:
- чёрное худи «Novak Motori»
- кожаная куртка-бомбер
