# Модели RouterAI по задачам. НЕ хардкодить ID моделей в коде (см. ТЗ §3.1) —
# только читать отсюда. Проверено в каталоге routerai.ru/models на 27.09.2026,
# ID и цены могут измениться — сверить перед реальным использованием.
#
# `--quality high` (там, где реализовано) переключает на *_quality вместо
# *_draft/default — экономия по умолчанию, доплата только по явному флагу.

write_character:
  default: anthropic/claude-sonnet-5
  fallback: deepseek/deepseek-v4-pro-0813

photo:
  # seedream-4.5 давал мультяшный/пластиковый результат с артефактами —
  # заменено на gpt-image-2 (проверено вживую 27.09.2026: фотореалистично,
  # держит консистентность лица через input_references). Тот же контракт
  # эндпоинта (POST /images/generations, input_references), смена модели
  # не потребовала правок адаптера.
  default: openai/gpt-image-2
  quality: black-forest-labs/flux.2-pro

video:
  default: alibaba/wan-2.6
  quality: bytedance/seedance-2.0

voice:
  # Не в исходном ТЗ (там только фото/видео) — добавлено по прямому запросу
  # владельца. Модель по умолчанию сменена на bytedance-seed/seed-audio-1-0
  # (семейство Seed, как и фото bytedance-seed/seedream-4.5 в M2/M3) по
  # прямому запросу. ВНИМАНИЕ: по прямой просьбе владельца эта смена сделана
  # БЕЗ обращения к API — ни эндпоинт, ни точная форма параметра для
  # голоса/тона НЕ подтверждены вживую (в отличие от предыдущего выбора,
  # gemini-3.8-flash-tts, который был проверен реальным запросом до 402
  # Insufficient balance). Ниже — только то, что можно определить из
  # описания модели в каталоге routerai.ru/models (кэш, не новый запрос).
  default: bytedance-seed/seed-audio-1-0
  quality: minimax/speech-2.8-hd
  # Из описания каталога: "Seed Audio 1.0 ... создаёт речь на основе
  # текстового запроса на естественном языке, который может описывать
  # желаемый голос, тон и звуковые эффекты, с возможностью использования
  # идентификатора Seed speaker ID или эталонного аудиоклипа для клонирования
  # голоса". Значит `voice` для этой модели, вероятно, принимает не короткий
  # пресет-id (как "alloy"/"Leda" у OpenAI/Gemini), а свободное описание —
  # НЕ ПОДТВЕРЖДЕНО без реального запроса. Ниже — такое описание, подобранное
  # под персонажа (см. persona/bible.md после init-persona: 24 года, Сплит,
  # уверенная, сухой юмор, тёплая к своим):
  voice_name: >-
    Young confident woman in her mid-20s, warm and slightly playful tone with
    dry sense of humor, casual conversational pace, natural and unpolished
    (not corporate/announcer-like), light Croatian accent in English speech.
  # Что проверить при первом реальном запросе (нужен баланс на аккаунте):
  #   1. Принимает ли API вообще произвольный текст в поле `voice`, или
  #      нужен отдельный параметр/формат (например, описание внутри `input`,
  #      а `voice` — обязательный короткий speaker-id).
  #   2. Если `voice` требует именно Seed speaker ID — придётся сначала
  #      найти список готовых speaker ID в документации RouterAI/ByteDance
  #      Seed (не просмотрено — недоступно без сети/запроса к каталогу
  #      конкретной модели).
  #   3. Качество на слух — тот же принцип, что и раньше: см.
  #      `uv run voice-line --text "..." --voice "<альтернативное описание>"`
  #      для A/B без правки этого файла.
