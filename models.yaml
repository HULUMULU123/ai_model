# Модели RouterAI по задачам. НЕ хардкодить ID моделей в коде (см. ТЗ §3.1) —
# только читать отсюда. Проверено в каталоге routerai.ru/models на 27.09.2026,
# ID и цены могут измениться — сверить перед реальным использованием.
#
# `--quality high` (там, где реализовано) переключает на *_quality вместо
# *_draft/default — экономия по умолчанию, доплата только по явному флагу.

write_character:
  default: anthropic/claude-sonnet-5
  fallback: deepseek/deepseek-v4-pro-0813

photo:
  # seedream-4.5 давал мультяшный/пластиковый результат с артефактами —
  # заменено на gpt-image-2 (проверено вживую 27.09.2026: фотореалистично,
  # держит консистентность лица через input_references). Тот же контракт
  # эндпоинта (POST /images/generations, input_references), смена модели
  # не потребовала правок адаптера.
  default: openai/gpt-image-2
  quality: black-forest-labs/flux.2-pro

video:
  # Сменено на Wan 3.0 по прямому запросу (было wan-2.6). Каталог
  # (routerai.ru/models, кэш) для wan-3.0: supported_sizes: null,
  # supported_resolutions: ["480p","720p","1080p"], supported_aspect_ratios:
  # ["16:9","4:3","1:1","3:4","9:16"] — в отличие от wan-2.6 (у которой был
  # конкретный supported_sizes набор WxH), здесь нет готовых WxH-строк,
  # значит нужны отдельные поля resolution+aspect_ratio, а не единое "size".
  # НЕ ПОДТВЕРЖДЕНО реальным запросом — это вывод из метаданных каталога, а
  # не проверенный вживую контракт (в отличие от wan-2.6, где "size":"720x1280"
  # дошёл до 402 Insufficient balance).
  default: alibaba/wan-3.0
  quality: bytedance/seedance-2.0
  # Разрешение — 720p (по прямому запросу, "пока"; 1080p доступно как
  # supported_resolutions, поднять явным флагом позже, если понадобится).
  resolution: "720p"
  aspect_ratio: "9:16"

voice:
  # Не в исходном ТЗ (там только фото/видео) — добавлено по прямому запросу
  # владельца. Модель по умолчанию — bytedance-seed/seed-audio-1-0 (семейство
  # Seed, как и фото seedream-4.5). Выбор модели/описания голоса сделан БЕЗ
  # обращения к API (по прямой просьбе) — не то же самое, что "проверено
  # вживую".
  default: bytedance-seed/seed-audio-1-0
  quality: minimax/speech-2.8-hd
  # ПОДТВЕРЖДЕНО вживую 27.09.2026 (реальный прогон через бота): эта модель
  # принимает произвольный текст в поле `voice` (описание голоса/тона, не
  # короткий пресет-id) — запрос дошёл до генерации, не отклонён по формату
  # `voice`. НЕ путать с response_format: та же попытка вернула `503 ZodError
  # ... invalid_value ... path: response_format ... expected "mp3"|"pcm"` —
  # значит response_format="opus" эта модель не поддерживает вообще, только
  # mp3/pcm (см. gen/voice.py — response_format="mp3" по умолчанию,
  # gen/telegram_entry.py отправляет получившийся mp3 через sendAudio, не
  # sendVoice, потому что настоящий кружок-голосовое Telegram требует
  # ogg/opus, а перекодирования в этом инструменте нет).
  voice_name: >-
    Young confident woman in her mid-20s, warm and slightly playful tone with
    dry sense of humor, casual conversational pace, natural and unpolished
    (not corporate/announcer-like), light Croatian accent in English speech.
    Sounds like a real voice message recorded on the go — as if she's walking
    somewhere or doing something with her hands while talking, not sitting
    still in front of a microphone: natural breathing, slightly uneven pacing,
    occasional background-life energy, not studio-clean narration.
  # Ещё не проверено на слух — совпадает ли это описание с ожидаемым звучанием
  # персонажа, может решить только прослушивание. Сравнение пресетов:
  # `uv run voice-line --text "..." --voice "<альтернативное описание>"`.
