# Модели RouterAI по задачам. НЕ хардкодить ID моделей в коде (см. ТЗ §3.1) —
# только читать отсюда. Проверено в каталоге routerai.ru/models на 27.09.2026,
# ID и цены могут измениться — сверить перед реальным использованием.
#
# `--quality high` (там, где реализовано) переключает на *_quality вместо
# *_draft/default — экономия по умолчанию, доплата только по явному флагу.

write_character:
  default: anthropic/claude-sonnet-5
  fallback: deepseek/deepseek-v4-pro-0813

photo:
  # seedream-4.5 давал мультяшный/пластиковый результат с артефактами —
  # заменено на gpt-image-2 (проверено вживую 27.09.2026: фотореалистично,
  # держит консистентность лица через input_references). Тот же контракт
  # эндпоинта (POST /images/generations, input_references), смена модели
  # не потребовала правок адаптера.
  default: openai/gpt-image-2
  quality: black-forest-labs/flux.2-pro

video:
  # Сменено на Wan 3.0 по прямому запросу (было wan-2.6). Каталог
  # (routerai.ru/models, кэш) для wan-3.0: supported_sizes: null,
  # supported_resolutions: ["480p","720p","1080p"], supported_aspect_ratios:
  # ["16:9","4:3","1:1","3:4","9:16"] — в отличие от wan-2.6 (у которой был
  # конкретный supported_sizes набор WxH), здесь нет готовых WxH-строк,
  # значит нужны отдельные поля resolution+aspect_ratio, а не единое "size".
  # НЕ ПОДТВЕРЖДЕНО реальным запросом — это вывод из метаданных каталога, а
  # не проверенный вживую контракт (в отличие от wan-2.6, где "size":"720x1280"
  # дошёл до 402 Insufficient balance).
  default: alibaba/wan-3.0
  quality: bytedance/seedance-2.0
  # Разрешение — 720p (по прямому запросу, "пока"; 1080p доступно как
  # supported_resolutions, поднять явным флагом позже, если понадобится).
  resolution: "720p"
  aspect_ratio: "9:16"

voice:
  # Не в исходном ТЗ (там только фото/видео) — добавлено по прямому запросу
  # владельца.
  #
  # bytedance-seed/seed-audio-1-0 (был выбран без обращения к API) СЛОМАН на
  # реальном прогоне: `503 {"error":{"message":"Provider rejected the
  # request: speaker <наш текст>...","code":400}}`. Значит поле называется
  # `speaker`, не `voice`, и — что важнее — оно НЕ принимает произвольное
  # описание голоса на естественном языке, а требует конкретный Seed speaker
  # ID, которого у нас нет и список которого недоступен без документации
  # ByteDance Seed. Отказался от этой модели.
  #
  # Откат на google/gemini-3.8-flash-tts — эта модель была проверена вживую
  # ещё в первом прогоне (запрос дошёл до 402 Insufficient balance, не до
  # ошибки формата) и принимает короткие пресет-id голоса (документированы
  # 30 студийных голосов: Zephyr, Kore, Leda, Aoede, ...), а не свободный
  # текст — так безопаснее, раз "speaker vs voice-description" на практике
  # оказалось моделезависимым и непредсказуемым без документации.
  default: google/gemini-3.8-flash-tts
  quality: minimax/speech-2.8-hd
  # "Leda" — по официальному описанию Google ("Youthful"), разумное
  # приближение под 24-летнюю героиню. НЕ проверено на слух — совпадает ли
  # это со звучанием персонажа, может решить только прослушивание живым
  # человеком. Сравнение пресетов без правки этого файла:
  # `uv run voice-line --text "..." --voice Kore` (и другие: Zephyr, Aoede,
  # Puck, ...).
  voice_name: Leda
