# Модели RouterAI по задачам. НЕ хардкодить ID моделей в коде (см. ТЗ §3.1) —
# только читать отсюда. Проверено в каталоге routerai.ru/models на 27.09.2026,
# ID и цены могут измениться — сверить перед реальным использованием.
#
# `--quality high` (там, где реализовано) переключает на *_quality вместо
# *_draft/default — экономия по умолчанию, доплата только по явному флагу.

write_character:
  default: anthropic/claude-sonnet-5
  fallback: deepseek/deepseek-v4-pro-0813

photo:
  # seedream-4.5 давал мультяшный/пластиковый результат с артефактами —
  # заменено на gpt-image-2 (проверено вживую 27.09.2026: фотореалистично,
  # держит консистентность лица через input_references). Тот же контракт
  # эндпоинта (POST /images/generations, input_references), смена модели
  # не потребовала правок адаптера.
  default: openai/gpt-image-2
  quality: black-forest-labs/flux.2-pro

video:
  default: alibaba/wan-2.6
  quality: bytedance/seedance-2.0

voice:
  # Не в исходном ТЗ (там только фото/видео) — добавлено по прямому запросу
  # владельца. Эндпоинт /audio/speech подтверждён вживую 27.09.2026 (принял
  # запрос как валидный, упёрся в тот же 402 Insufficient balance, что и
  # image/video); реальный аудиофайл не получен — баланс отрицательный.
  default: google/gemini-3.8-flash-tts
  quality: minimax/speech-2.8-hd
  # Gemini TTS документирует 30 готовых студийных голосов (Zephyr, Kore,
  # Leda, Aoede, ...). "Leda" выбран по описанию Google ("Youthful") как
  # разумное приближение под 24-летнюю героиню — НЕ подтверждено на слух:
  # баланс аккаунта отрицательный, реальный звук не получен. Проверка "звучит
  # натурально и похоже на персонажа" в принципе требует прослушивания живым
  # человеком — это не то, что можно верифицировать автоматически или на
  # глаз по документации. Пополни баланс → сгенерируй пару фраз разными
  # голосами (`uv run voice-line --text "..."`, меняя voice_name) → выбери
  # на слух. Модель также поддерживает Google Voice Design (кастомный голос
  # из текстового описания) и Voice Replication (клонирование по образцу) —
  # может дать более точное попадание в образ, чем пресет, но это отдельная
  # интеграция (два шага: сначала создать voice_id), не сделано в этой версии.
  voice_name: Leda
