[project]
name = "content-gen"
version = "0.1.0"
description = "Генератор фото/видео контента одного ИИ-персонажа (без публикации)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "click>=8.1",
    "insightface>=2.0",
    "onnxruntime>=1.30.0",
]

[project.scripts]
init-persona = "gen.cli:init_persona"
generate = "gen.cli:generate"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
